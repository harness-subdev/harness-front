name: Build and Release
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      name: ${{ steps.build.outputs.name }}
      version: ${{ steps.build.outputs.version }}
      sha: ${{ steps.build.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Test, package, and verify
        id: build
        run: bash scripts/build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.build.outputs.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.build.outputs.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
          BUILD_SHA: ${{ needs.build.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c *.sha256
          printf 'Codex 스킬 7개와 검증 도구를 포함한 배포본입니다.\n\nVersion: %s\nCommit: %s\nBuild: %s\n\n설치 및 검증 방법은 압축 파일의 docs/RELEASING.md를 참고하세요.\n' "$VERSION" "$BUILD_SHA" "$RUN_URL" > notes.md
          # Existing drafts/releases fail closed; never replace published assets.
          gh release create "$TAG" ./*.tar.gz ./*.sha256 --verify-tag --title "harness-front $TAG" --notes-file notes.md --generate-notes
