interface:
  display_name: "Web Reference React Architecture"
  short_description: "InitPage·휴대용 스타일·혼합 전달의 React 구조 설계"
  default_prompt: "Use $web-reference-react-architecture. 승인된 레퍼런스로 역할별 구조와 InitPage·portable.css·자산·모션·variation·다중 TGZ 검증 계약을 설계한다. 기존 Next.js는 React + Vite 포팅을 안내하고 원본 경로·서버 기능의 대응 방식을 설계한다. 신규 프로젝트와 Next.js 포팅은 지정 템플릿 clone과 초기·최종 구조 검사를 필수 구현 단계로 기록한다. 설계 단계에서 앱 생성이나 clone은 실행하지 않는다."
